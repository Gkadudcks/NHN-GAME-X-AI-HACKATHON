      <rect width="512" height="138" fill="#b88668" stroke="#4f4849" stroke-width="6"/>
      <rect y="116" width="512" height="22" fill="#845d50"/>
      <rect x="122" y="-38" width="266" height="54" fill="#7cafba" stroke="#343942" stroke-width="6"/>
      <rect x="132" y="-28" width="246" height="34" fill="#afd4d9"/>
      <rect x="418" y="-18" width="28" height="38" fill="#e4d7c6" stroke="#5d5049" stroke-width="4"/>
    </g>
