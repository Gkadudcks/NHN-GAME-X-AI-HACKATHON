<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" preserveAspectRatio="none" shape-rendering="crispEdges">
  <defs>
    <pattern id="floor" width="192" height="720" patternUnits="userSpaceOnUse">
      <rect width="192" height="720" fill="#c99763"/>
      <rect x="0" width="84" height="720" fill="#cf9f68"/>
      <rect x="84" width="12" height="720" fill="#b98555"/>
      <rect x="96" width="96" height="720" fill="#d2a56f"/>
    </pattern>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f343d"/>
      <stop offset="0.12" stop-color="#2f343d"/>
      <stop offset="0.12" stop-color="#d6c9ba"/>
      <stop offset="1" stop-color="#d6c9ba"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#85bfd9"/>
      <stop offset="0.57" stop-color="#85bfd9"/>
      <stop offset="0.57" stop-color="#b9d5d2"/>
      <stop offset="0.63" stop-color="#b9d5d2"/>
      <stop offset="0.63" stop-color="#8fa69e"/>
    </linearGradient>
  </defs>

  <g id="office-background">
    <rect width="1600" height="720" fill="url(#floor)"/>
    <rect width="1600" height="302" fill="url(#wall)"/>
    <rect y="302" width="1600" height="12" fill="#6b5a52"/>
    <rect y="314" width="1600" height="10" fill="#8f6e55"/>
    <rect y="324" width="1600" height="8" fill="#a77b58"/>
  </g>

  <g id="office-window">
    <rect x="24" y="40" width="1552" height="212" fill="url(#sky)" stroke="#515a61" stroke-width="6"/>
    <rect x="24" y="230" width="1552" height="22" fill="#899b95"/>
    <g fill="#4d565f">
      <rect x="150" y="40" width="18" height="212"/><rect x="405" y="40" width="18" height="212"/>
      <rect x="660" y="40" width="18" height="212"/><rect x="915" y="40" width="18" height="212"/>
      <rect x="1170" y="40" width="18" height="212"/><rect x="1425" y="40" width="18" height="212"/>
    </g>
    <g fill="#ffffff25">
      <rect x="190" y="46" width="14" height="190"/><rect x="450" y="46" width="14" height="190"/>
      <rect x="710" y="46" width="14" height="190"/><rect x="970" y="46" width="14" height="190"/>
      <rect x="1230" y="46" width="14" height="190"/><rect x="1490" y="46" width="14" height="190"/>
    </g>
  </g>

  <g id="office-boss-desk">
    <rect x="586" y="354" width="432" height="86" fill="#49393d55"/>
    <rect x="576" y="344" width="432" height="86" fill="#a97558" stroke="#514746" stroke-width="6"/>
    <rect x="582" y="410" width="420" height="20" fill="#805747"/>
    <rect x="630" y="278" width="160" height="64" fill="#7cafba" stroke="#343942" stroke-width="6"/>
    <rect x="638" y="286" width="144" height="48" fill="#afd4d9"/>
    <rect x="900" y="294" width="28" height="38" fill="#e4d7c6" stroke="#5d5049" stroke-width="4"/>
  </g>

  <g id="office-partitions" fill="#7c8589" opacity="0.96">
