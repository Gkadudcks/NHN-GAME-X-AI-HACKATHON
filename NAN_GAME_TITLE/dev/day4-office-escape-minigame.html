<!doctype html>
<html lang="ko" data-office-escape-dev="true">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../">
  <title>DAY 4 정시 퇴근 작전 · 개발 전용</title>
  <link rel="stylesheet" href="css/fonts.css?v=1">
  <link rel="stylesheet" href="css/minigame-dev.css?v=1">
  <link rel="stylesheet" href="css/office-escape-minigame.css?v=16">
  <style>
    .minigame-dev .office-escape { top: 64px; padding: 10px; }
    .minigame-dev .oe-shell { width: min(1280px, 99vw); }
    @media (min-width: 901px) and (max-height: 760px) {
      .minigame-dev .oe-shell,
      .minigame-dev .oe-play,
      .minigame-dev .oe-intro,
      .minigame-dev .oe-result {
        height: calc(100dvh - 84px);
        min-height: 0;
      }
      .minigame-dev .oe-play {
        display: grid;
        grid-template-rows: 64px minmax(0, 1fr);
      }
      .minigame-dev .oe-course {
        height: auto;
        min-height: 0;
      }
    }
    @media (max-width: 900px) {
      body.minigame-dev .minigame-dev-toolbar {
        position: fixed;
        min-height: 64px;
        flex-direction: row;
        padding: 8px 10px;
      }
      .minigame-dev-toolbar > div,
      #dev-controls label,
      #dev-controls label.check { display: none; }
      #dev-controls {
        width: 100%;
        gap: 6px;
        flex-wrap: nowrap;
        justify-content: center;
      }
      #dev-controls button,
      #dev-controls a {
        flex: 1 1 0;
        justify-content: center;
        min-width: 0;
        padding-inline: 6px;
        font-size: 11px;
      }
      .minigame-dev .office-escape {
        top: 64px;
        overflow: hidden;
      }
      .minigame-dev .oe-shell {
        width: 100%;
        height: calc(100dvh - 84px);
        min-height: 0;
      }
      .minigame-dev .oe-course {
        height: auto;
        min-height: 280px;
      }
    }
    @media (max-width: 900px) and (max-height: 620px) {
      body.minigame-dev .minigame-dev-toolbar {
        min-height: 48px;
        padding-block: 4px;
      }
      .minigame-dev .office-escape { top: 48px; padding: 0; }
      .minigame-dev .oe-shell,
      .minigame-dev .oe-play,
      .minigame-dev .oe-intro,
      .minigame-dev .oe-result {
        height: calc(100dvh - 48px);
        min-height: 0;
      }
      .minigame-dev .oe-play {
        display: grid;
        grid-template-rows: 56px minmax(0, 1fr) 72px;
      }
      .minigame-dev .oe-course {
        height: auto;
        min-height: 0;
      }
      .minigame-dev .oe-hud {
        min-height: 0;
        padding-block: 5px;
      }
      .minigame-dev .oe-play-footer {
        min-height: 0;
        padding: 2px 9px;
      }
      .minigame-dev .oe-touch-controls {
        height: 48px;
      }
      .minigame-dev .oe-touch-controls button {
        height: 48px;
      }
    }
  </style>
</head>
<body class="minigame-dev">
  <!--
    THESIS: 17:58 엘리베이터 막차를 향한 연속 공간; 고정 배경 위 웹 대시보드를 거부한다.
    OWN-WORLD: 남색·아이보리·출구 초록·경고 주황, 스모크 유리와 바닥 유도선의 오피스 러너.
    STORY: 고정된 도윤이 두 동사로 위험을 넘고, 문턱이 지나가며 부장 추격과 퇴근 거리를 체감한다.
    FIRST VIEWPORT: 64px HUD 아래 90% 게임 월드, 좌측 32% 도윤, 우측 위험과 물리적 구간 문턱.
    FORM: grounded direction 6, threshold-rhythm staging, approved comp C; seed key c834466a.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <header class="minigame-dev-toolbar">
    <div>
      <strong>DAY 4 OFFICE ESCAPE LAB</strong>
      <span id="dev-run-status" role="status">초기화 중</span>
    </div>
    <form id="dev-controls">
      <label>플레이 시간
        <input id="dev-duration" type="number" min="15" max="90" step="1" value="64">
      </label>
      <label class="check">
        <input id="dev-assist" type="checkbox" checked>
        하린 1회 보조
      </label>
      <label class="check">
        <input id="dev-review-art" type="checkbox" checked>
        review 아트
      </label>
      <label class="check">
        <input id="dev-intro" type="checkbox">
        인트로부터
      </label>
      <label class="check">
        <input id="dev-hitboxes" type="checkbox">
        판정 보기
      </label>
      <button type="submit">다시 실행</button>
      <button id="dev-pause" type="button">일시정지</button>
      <a href="day4.html?new=1">DAY 4 본편</a>
    </form>
  </header>

  <main class="minigame-dev-result">
    <section>
      <small>LAST CALLBACK RESULT</small>
      <h1>정시 퇴근 작전 결과</h1>
      <p>미니게임의 “스토리 계속하기”를 누르면 콜백 결과가 여기에 표시됩니다.</p>
      <pre id="dev-result-json">아직 완료 결과가 없습니다.</pre>
    </section>
  </main>

  <script src="js/art-assets.js?v=13"></script>
  <script src="js/office-escape-minigame-core.js?v=9"></script>
  <script src="js/office-escape-minigame.js?v=18"></script>
  <script src="js/day4-office-escape-minigame-dev.js?v=9"></script>
</body>
</html>
